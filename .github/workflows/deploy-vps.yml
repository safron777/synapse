name: Deploy Matrix to VPS

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH with encrypted key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
      run: |
        sudo apt-get update && sudo apt-get install -y expect
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
        
        # Start ssh-agent and add key with passphrase
        eval $(ssh-agent -s)
        expect << EOF
        spawn ssh-add ~/.ssh/id_rsa
        expect "Enter passphrase"
        send "$SSH_PASSPHRASE\r"
        expect eof
        EOF
        
    - name: Deploy to VPS
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        MATRIX_DOMAIN: ${{ secrets.MATRIX_DOMAIN }}
        TURN_DOMAIN: ${{ secrets.TURN_DOMAIN }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        COTURN_SECRET: ${{ secrets.COTURN_SECRET }}
      run: |
        ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
          cd /opt/synapse
          
          git pull origin develop
          
          cat > .env << 'ENVEOF'
        MATRIX_DOMAIN=${{ secrets.MATRIX_DOMAIN }}
        TURN_DOMAIN=${{ secrets.TURN_DOMAIN }}
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        COTURN_SECRET=${{ secrets.COTURN_SECRET }}
        ENVEOF
          
          chmod +x deploy.sh
          ./deploy.sh
          
          docker system prune -f
        EOF